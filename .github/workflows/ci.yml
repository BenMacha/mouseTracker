name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '5.4.*' }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.3', symfony: '6.4.*' }
          - { php: '8.3', symfony: '7.4.*' }
          - { php: '8.4', symfony: '7.4.*' }

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2, flex

      - name: Configure Composer
        run: |
          composer config extra.symfony.require "${{ matrix.symfony }}"
          # Some currently-published Symfony patch releases are flagged by
          # Composer 2.8's audit-blocker. The bundle itself is not affected;
          # consumers control their own pin. Don't fail CI on this.
          composer config audit.block-insecure false

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-sf-${{ matrix.symfony }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-sf-${{ matrix.symfony }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --no-audit

      - name: Run tests
        run: vendor/bin/phpunit
